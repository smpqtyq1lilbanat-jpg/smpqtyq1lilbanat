<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berita & Artikel - SMPQT Yanbu'ul Qur'an 1 Lil Banat</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        },
                        secondary: {
                            400: '#fbbf24',
                            500: '#f59e0b',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Merriweather', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans text-gray-800 bg-slate-50 antialiased min-h-screen flex flex-col">

    <!-- Simple Navigation -->
    <nav class="w-full bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <a href="index.html" class="flex items-center text-primary-800 hover:text-primary-600 transition font-medium">
                    <i class="fas fa-arrow-left mr-2"></i> Kembali ke Beranda
                </a>
                <div class="flex items-center">
                    <img src="logo.png" alt="Logo SMPQT" class="w-10 h-10 object-contain mr-2" onerror="this.style.display='none'">
                    <span class="font-bold text-primary-900 hidden sm:block font-serif text-sm">SMPQT Yanbu'ul Qur'an 1 Lil Banat</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
        
        <!-- Section: List Berita (Akan muncul jika URL tidak memiliki parameter ?id=) -->
        <div id="news-list-section">
            <div class="text-center max-w-3xl mx-auto mb-12">
                <span class="text-primary-700 font-bold tracking-wider uppercase text-xs sm:text-sm">Kabar Sekolah</span>
                <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mt-2 font-serif">Berita & Artikel Terbaru</h1>
                <p class="mt-3 text-sm sm:text-base text-gray-600">Ikuti perkembangan informasi, prestasi, dan kegiatan harian di SMPQT Yanbu'ul Qur'an 1 Lil Banat.</p>
            </div>
            
            <!-- Grid List Berita -->
            <div id="news-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Data berita akan otomatis dimasukkan di sini oleh JavaScript -->
                <div class="col-span-full text-center py-12 text-gray-500">
                    <i class="fas fa-spinner fa-spin text-3xl mb-4 text-primary-700"></i>
                    <p>Memuat berita terbaru...</p>
                </div>
            </div>
        </div>

        <!-- Section: Detail Berita (Akan muncul jika pengunjung mengklik salah satu berita) -->
        <div id="news-detail-section" class="hidden max-w-3xl mx-auto">
            <!-- Data detail berita dimasukkan di sini -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-300 py-8 border-t-4 border-secondary-500 mt-12 text-center text-xs">
        <p>&copy; 2026 SMPQT Yanbu'ul Qur'an 1 Lil Banat. Seluruh hak cipta dilindungi.</p>
    </footer>

    <!-- JS Engine: Dinamis Router & Parser -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const newsGrid = document.getElementById('news-grid');
            const newsListSection = document.getElementById('news-list-section');
            const newsDetailSection = document.getElementById('news-detail-section');

            // 1. Ambil data dari berita.json
            fetch('berita.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Gagal memuat berita.json');
                    }
                    return response.json();
                })
                .then(posts => {
                    // Cek apakah ada parameter ?id= di URL
                    const urlParams = new URLSearchParams(window.location.search);
                    const postId = urlParams.get('id');

                    if (postId) {
                        // TAMPILKAN SINGLE ARTICLE DETAIL
                        const post = posts.find(p => p.id === postId);
                        if (post) {
                            renderDetail(post);
                        } else {
                            newsDetailSection.innerHTML = `
                                <div class="text-center py-12">
                                    <i class="fas fa-exclamation-triangle text-red-500 text-4xl mb-4"></i>
                                    <h2 class="text-2xl font-bold mb-2">Artikel Tidak Ditemukan</h2>
                                    <a href="berita.html" class="text-primary-700 font-semibold hover:underline">Kembali ke daftar berita</a>
                                </div>
                            `;
                            newsListSection.classList.add('hidden');
                            newsDetailSection.classList.remove('hidden');
                        }
                    } else {
                        // TAMPILKAN GRID LIST SEMUA BERITA
                        renderList(posts);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    newsGrid.innerHTML = `
                        <div class="col-span-full text-center py-12 text-red-500">
                            <i class="fas fa-exclamation-circle text-4xl mb-4"></i>
                            <p class="font-bold">Gagal memuat database berita.</p>
                            <p class="text-sm text-gray-500">Pastikan file berita.json sudah diunggah dan tidak ada kesalahan penulisan format JSON.</p>
                        </div>
                    `;
                });

            // Fungsi render daftar semua berita
            function renderList(posts) {
                newsGrid.innerHTML = '';
                posts.forEach(post => {
                    const postCard = document.createElement('div');
                    postCard.className = "bg-white rounded-2xl shadow-md overflow-hidden border border-gray-100 flex flex-col h-full hover:shadow-lg transition-all duration-300";
                    postCard.innerHTML = `
                        <div class="h-48 overflow-hidden bg-gray-100">
                            <img src="${post.image}" alt="${post.title}" class="w-full h-full object-cover hover:scale-105 transition duration-500" onerror="this.src='https://placehold.co/600x400/15803d/ffffff?text=Berita+Sekolah'">
                        </div>
                        <div class="p-6 flex-grow flex flex-col">
                            <div class="flex items-center text-xs text-gray-500 mb-3 space-x-4">
                                <span><i class="fas fa-calendar-alt mr-1.5 text-primary-700"></i>${post.date}</span>
                                <span><i class="fas fa-user mr-1.5 text-primary-700"></i>${post.author}</span>
                            </div>
                            <h3 class="font-bold text-gray-900 text-lg mb-3 line-clamp-2 hover:text-primary-700 transition">
                                <a href="berita.html?id=${post.id}">${post.title}</a>
                            </h3>
                            <p class="text-gray-600 text-sm mb-4 line-clamp-3">${post.summary}</p>
                            <a href="berita.html?id=${post.id}" class="text-primary-700 font-semibold text-sm hover:text-primary-800 mt-auto flex items-center">
                                Baca Selengkapnya <i class="fas fa-arrow-right ml-2 text-xs"></i>
                            </a>
                        </div>
                    `;
                    newsGrid.appendChild(postCard);
                });
                newsListSection.classList.remove('hidden');
                newsDetailSection.classList.add('hidden');
            }

            // Fungsi render detail halaman artikel
            function renderDetail(post) {
                // Mengubah \n di JSON menjadi tag paragraf asli <p>
                const paragraphHTML = post.content.split('\n\n').map(p => `<p class="mb-6 leading-relaxed text-gray-700 text-base md:text-lg">${p.replace(/\n/g, '<br>')}</p>`).join('');

                newsDetailSection.innerHTML = `
                    <article class="bg-white rounded-3xl p-6 sm:p-10 shadow-lg border border-gray-100">
                        <!-- Heading -->
                        <h1 class="text-2xl sm:text-3xl md:text-4xl font-extrabold text-gray-900 mb-6 font-serif leading-tight">${post.title}</h1>
                        
                        <!-- Metadata -->
                        <div class="flex flex-wrap gap-4 text-xs sm:text-sm text-gray-500 mb-8 pb-6 border-b border-gray-100">
                            <span class="flex items-center"><i class="fas fa-calendar-alt mr-2 text-primary-700"></i>${post.date}</span>
                            <span class="flex items-center"><i class="fas fa-user mr-2 text-primary-700"></i>Oleh: ${post.author}</span>
                            <span class="flex items-center"><i class="fas fa-eye mr-2 text-primary-700"></i>Umum</span>
                        </div>

                        <!-- Main Image -->
                        <div class="rounded-2xl overflow-hidden mb-8 shadow bg-gray-100 max-h-[450px]">
                            <img src="${post.image}" alt="${post.title}" class="w-full h-full object-cover object-center" onerror="this.src='https://placehold.co/800x450/15803d/ffffff?text=Berita+Sekolah'">
                        </div>

                        <!-- Content Paragraphs -->
                        <div class="prose max-w-none">
                            ${paragraphHTML}
                        </div>

                        <!-- Footer Article / Back Button -->
                        <div class="mt-12 pt-6 border-t border-gray-100 flex justify-between items-center">
                            <a href="berita.html" class="bg-primary-700 hover:bg-primary-800 text-white px-5 py-2.5 rounded-full font-medium text-sm transition flex items-center shadow">
                                <i class="fas fa-arrow-left mr-2"></i> Kembali ke Daftar Berita
                            </a>
                            <!-- Share to WA -->
                            <a href="https://api.whatsapp.com/send?text=Baca berita menarik ini: ${encodeURIComponent(window.location.href)}" target="_blank" class="bg-green-500 hover:bg-green-600 text-white w-10 h-10 rounded-full flex items-center justify-center transition shadow" title="Bagikan ke WhatsApp">
                                <i class="fab fa-whatsapp text-lg"></i>
                            </a>
                        </div>
                    </article>
                `;
                newsListSection.classList.add('hidden');
                newsDetailSection.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
