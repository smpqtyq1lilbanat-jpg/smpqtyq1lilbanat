<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login CBT - Olimpiade</title>
    
    <!-- Impor Tailwind CSS untuk Styling Cepat -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Impor Supabase JS (UMD) dari CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Impor Font Google (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Background gradient lembut */
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%); 
        }

        /* Animasi untuk Toast Notifikasi */
        .toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #ef4444; /* Warna merah untuk error default */
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 50;
            left: 50%;
            top: 30px;
            transform: translateX(-50%);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            opacity: 0;
            transition: opacity 0.3s, top 0.3s, visibility 0.3s;
        }

        .toast.show {
            visibility: visible;
            opacity: 1;
            top: 50px; /* Turun sedikit saat muncul */
        }
        
        .toast.success {
            background-color: #10b981; /* Warna hijau untuk sukses */
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Tempat memunculkan notifikasi Toast -->
    <div id="toastMessage" class="toast">Notifikasi muncul di sini</div>

    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden">
        <!-- Header Card -->
        <div class="bg-blue-600 p-6 text-center">
            <h1 class="text-2xl font-bold text-white mb-1">Portal Ujian CBT</h1>
            <p class="text-blue-100 text-sm">Silakan masuk menggunakan identitas Anda</p>
        </div>

        <!-- Form Login -->
        <div class="p-8">
            <form id="loginForm" class="space-y-6">
                
                <!-- Input Username -->
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-2">Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </div>
                        <input type="text" id="username" name="username" required 
                            class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition-colors bg-gray-50 text-gray-900" 
                            placeholder="Contoh: izzuddin03082017">
                    </div>
                </div>

                <!-- Input Password -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </div>
                        <input type="password" id="password" name="password" required 
                            class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition-colors bg-gray-50 text-gray-900" 
                            placeholder="Masukkan Password">
                    </div>
                </div>

                <!-- Tombol Submit -->
                <button type="submit" id="btnSubmit" 
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                    <span id="btnText">Masuk Ujian</span>
                    <!-- Loading Spinner (Disembunyikan default) -->
                    <svg id="btnLoading" class="animate-spin ml-2 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </form>
        </div>
        
        <div class="bg-gray-50 p-4 border-t border-gray-100 text-center">
            <p class="text-xs text-gray-500">Jika mengalami kendala, hubungi Guru Pendamping.</p>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. KONFIGURASI SUPABASE (Kunci Resmi Anda)
        // ==========================================
        const SUPABASE_URL = 'https://lsxwhwptaehjbszlupin.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxzeHdod3B0YWVoamJzemx1cGluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMTEyOTAsImV4cCI6MjEwMDc4NzI5MH0.ksDlmFGVqTsMQ14kth84UdH_imOTdkC308kcfYVOiBQ';
        
        // Inisialisasi Klien Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ==========================================
        // 2. DOM ELEMENTS & FUNGSI UTILITAS
        // ==========================================
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const btnSubmit = document.getElementById('btnSubmit');
        const btnText = document.getElementById('btnText');
        const btnLoading = document.getElementById('btnLoading');
        const toastMessage = document.getElementById('toastMessage');

        // Fungsi memunculkan Toast Notifikasi
        function showToast(message, type = 'error') {
            toastMessage.textContent = message;
            
            // Atur warna berdasarkan tipe
            if (type === 'success') {
                toastMessage.classList.remove('bg-red-500');
                toastMessage.classList.add('success');
            } else {
                toastMessage.classList.remove('success');
                toastMessage.classList.add('bg-red-500');
            }

            toastMessage.classList.add('show');

            // Hilangkan setelah 3 detik
            setTimeout(() => {
                toastMessage.classList.remove('show');
            }, 3000);
        }

        // Fungsi untuk mengubah status loading tombol
        function setLoading(isLoading) {
            if (isLoading) {
                btnSubmit.disabled = true;
                btnSubmit.classList.add('opacity-75', 'cursor-not-allowed');
                btnText.textContent = 'Memeriksa...';
                btnLoading.classList.remove('hidden');
            } else {
                btnSubmit.disabled = false;
                btnSubmit.classList.remove('opacity-75', 'cursor-not-allowed');
                btnText.textContent = 'Masuk Ujian';
                btnLoading.classList.add('hidden');
            }
        }

        // ==========================================
        // 3. LOGIKA UTAMA: PROSES LOGIN
        // ==========================================
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // Mencegah form memuat ulang halaman
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (!username || !password) {
                showToast("Username dan Password harus diisi!");
                return;
            }

            setLoading(true);

            try {
                const { data, error } = await supabase
                    .from('peserta')
                    .select('id, nama, mapel_lomba, status_ujian')
                    .eq('username', username)
                    .eq('password', password)
                    .single(); // .single() karena kita hanya butuh 1 baris (unik)

                // Jika error (tidak ditemukan atau salah password)
                if (error || !data) {
                    showToast("Username atau Password salah!");
                    setLoading(false);
                    return;
                }

                // Jika status ujian sudah selesai, tolak akses
                if (data.status_ujian === 'selesai') {
                    showToast("Anda sudah menyelesaikan ujian ini!");
                    setLoading(false);
                    return;
                }

                // JIKA BERHASIL LOGIN:
                showToast(`Selamat datang, ${data.nama}!`, 'success');
                
                // 1. Simpan Data Sesi ke LocalStorage agar bisa dibaca di halaman soal
                localStorage.setItem('cbt_user_id', data.id);
                localStorage.setItem('cbt_user_nama', data.nama);
                localStorage.setItem('cbt_mapel', data.mapel_lomba);

                // 2. Arahkan ke halaman berdasarkan Mapel Lomba (Beri jeda 1 detik agar notif sukses terlihat)
                setTimeout(() => {
                    if (data.mapel_lomba === 'Olimpiade Matematika') {
                        // Redirect ke file Matematika di Vercel/GitHub Anda
                        window.location.href = 'cbt_mtk.html'; 
                    } else if (data.mapel_lomba === 'Olimpiade IPA') {
                        // Redirect ke file IPA
                        window.location.href = 'cbt_ipa.html';
                    } else {
                        showToast(`Halaman untuk ${data.mapel_lomba} belum tersedia.`);
                        setLoading(false);
                    }
                }, 1000);

            } catch (err) {
                console.error("Terjadi kesalahan:", err);
                showToast("Terjadi kesalahan sistem. Coba lagi.");
                setLoading(false);
            }
        });

        // ==========================================
        // 4. PENGECEKAN SESI AWAL (Jika sudah login)
        // ==========================================
        window.onload = () => {
            // Jika user sudah login sebelumnya dan belum logout, arahkan langsung
            const savedUserId = localStorage.getItem('cbt_user_id');
            const savedMapel = localStorage.getItem('cbt_mapel');
            
            if (savedUserId && savedMapel) {
                 if (savedMapel === 'Olimpiade Matematika') {
                    window.location.href = 'cbt_mtk.html'; 
                } else if (savedMapel === 'Olimpiade IPA') {
                    window.location.href = 'cbt_ipa.html';
                }
            }
        };
    </script>
</body>
</html>
