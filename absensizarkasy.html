<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Absensi Zarkasy - SMPQ TYQ 1 Lil Banat</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Tailwind Configuration dari Website Utama -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        },
                        secondary: {
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Merriweather', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Checkbox & Transition Styles */
        .peserta-checkbox {
            accent-color: #15803d; /* primary-700 */
        }
        
        .checkbox-item {
            transition: all 0.2s ease-in-out;
        }
        .checkbox-item:hover:not(.sudah-absen) {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border-color: #16a34a; /* primary-600 */
        }
        
        /* Progress Bar Animation */
        .progress-bar-fill {
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Custom Scrollbar untuk daftar peserta */
        #checkboxList::-webkit-scrollbar {
            width: 6px;
        }
        #checkboxList::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        #checkboxList::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        #checkboxList::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="font-sans text-gray-800 bg-slate-50 antialiased min-h-screen flex flex-col pt-6 pb-12 px-4 md:px-0">

    <!-- Main Container Container -->
    <div class="max-w-xl w-full mx-auto bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100">
        
        <!-- Header Style dari Website Utama -->
        <div class="bg-primary-900 relative overflow-hidden px-6 py-8 sm:px-8 sm:py-10 text-center">
            <!-- Decorative Background Shape -->
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-primary-800 rounded-full opacity-50 z-0"></div>
            <div class="absolute -bottom-8 -left-8 w-24 h-24 bg-primary-800 rounded-full opacity-50 z-0"></div>
            
            <div class="relative z-10 flex flex-col items-center">
                <div class="w-14 h-14 sm:w-16 sm:h-16 bg-white rounded-full flex items-center justify-center text-primary-700 font-bold text-xl sm:text-2xl mb-3 shadow-lg border-2 border-secondary-500">
                    <i class="fas fa-clipboard-check"></i>
                </div>
                <h2 class="text-white font-serif text-2xl sm:text-3xl font-bold mb-1">Absensi Zarkasy</h2>
                <p class="text-primary-100 text-sm sm:text-base font-medium">SMPQT Yanbu'ul Qur'an 1 Lil Banat</p>
                <span class="inline-block mt-3 py-1 px-3 rounded-full bg-secondary-500/20 text-secondary-400 font-semibold text-xs border border-secondary-500/30 backdrop-blur-sm">
                    Sistem Rekapitulasi Rombongan
                </span>
            </div>
        </div>

        <!-- Form Section -->
        <div class="p-6 sm:p-8">
            <form id="absensiForm" class="space-y-5">
                
                <!-- Input Group 1 -->
                <div>
                    <label for="pos" class="block text-sm font-semibold text-gray-700 mb-2">Pos / Checkpoint</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-map-marker-alt text-primary-600"></i>
                        </div>
                        <select id="pos" required class="block w-full pl-10 pr-4 py-3 bg-slate-50 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-all cursor-pointer">
                            <option value="" disabled selected>-- Pilih Lokasi Keberangkatan --</option>
                            <option value="1. Berangkat">1. Berangkat</option>
                            <option value="2. Checkout Kudus">2. Checkout Kudus</option>
                            <option value="3. Checkout Rest Area">3. Checkout Rest Area</option>
                            <option value="4. Checkout Dusun Semilir">4. Checkout Dusun Semilir</option>
                            <option value="5. Checkout Wisma">5. Checkout Wisma</option>
                            <option value="6. Checkout Benteng Fort Willem">6. Checkout Benteng Fort Willem</option>
                            <option value="7. Checkout Saloka">7. Checkout Saloka</option>
                            <option value="8. Checkout RM. H. Ismun 4">8. Checkout RM. H. Ismun 4</option>
                        </select>
                    </div>
                </div>

                <!-- Input Group 2 -->
                <div>
                    <label for="bis" class="block text-sm font-semibold text-gray-700 mb-2">Pilih Bus Rombongan</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-bus text-primary-600"></i>
                        </div>
                        <select id="bis" required class="block w-full pl-10 pr-4 py-3 bg-slate-50 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-all cursor-pointer">
                            <option value="" disabled selected>-- Pilih Nomor Bus --</option>
                            <option value="BUS 1">BUS 1 (Satu)</option>
                            <option value="BUS 2">BUS 2 (Dua)</option>
                            <option value="BUS 3">BUS 3 (Tiga)</option>
                        </select>
                    </div>
                </div>

                <!-- Area Daftar Peserta (Hidden by Default) -->
                <div id="daftarPesertaContainer" class="hidden mt-8 pt-6 border-t-2 border-dashed border-gray-200">
                    
                    <!-- Header List & Select All -->
                    <div class="flex justify-between items-center bg-primary-50 px-4 py-3 rounded-xl border border-primary-100 mb-4">
                        <span class="font-bold text-primary-900 text-sm">Daftar Penumpang</span>
                        <label class="flex items-center cursor-pointer text-sm font-semibold text-primary-700 hover:text-primary-800 transition">
                            <input type="checkbox" id="selectAll" class="peserta-checkbox w-4 h-4 mr-2 rounded border-gray-300"> 
                            Pilih Semua
                        </label>
                    </div>
                    
                    <!-- Progress Bar -->
                    <div id="progressWrapper" class="hidden mb-5 px-1">
                        <div class="flex justify-between text-xs font-bold text-primary-700 mb-2">
                            <span id="progressText">Hadir: 0/0 Peserta</span>
                            <span id="progressPercent" class="bg-primary-100 px-2 py-0.5 rounded-full text-primary-800">0%</span>
                        </div>
                        <div class="w-full bg-gray-100 rounded-full h-2.5 overflow-hidden border border-gray-200">
                            <div id="progressBar" class="bg-primary-600 h-2.5 rounded-full progress-bar-fill w-0 shadow-sm"></div>
                        </div>
                    </div>
                    
                    <!-- Container List -->
                    <div id="checkboxList" class="flex flex-col gap-3 max-h-[400px] overflow-y-auto pr-2 pb-2">
                        <!-- Checkboxes will be injected here via JS -->
                    </div>
                    
                    <!-- Tombol Submit -->
                    <button type="submit" id="submitBtn" class="w-full mt-6 bg-primary-700 hover:bg-primary-800 text-white font-semibold py-3.5 sm:py-4 rounded-xl shadow-lg shadow-primary-700/30 transition duration-300 flex justify-center items-center gap-2 text-sm sm:text-base disabled:bg-gray-400 disabled:shadow-none disabled:cursor-not-allowed">
                        <i class="fas fa-paper-plane"></i> Kirim Data Absensi
                    </button>
                </div>
            </form>

            <!-- Pesan Status -->
            <div id="message" class="hidden mt-5 p-4 rounded-xl text-center text-sm font-semibold shadow-sm"></div>
        </div>
        
        <!-- Footer Form -->
        <div class="bg-gray-50 py-4 text-center border-t border-gray-100">
            <p class="text-[10px] text-gray-500 font-medium">&copy; 2026 Tim IT SMPQT Yanbu'ul Qur'an 1 Lil Banat</p>
        </div>
    </div>

<script>
    // Konfigurasi Supabase
    const supabaseUrl = 'https://vpdlfjbkfcuukyykrhua.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZwZGxmamJrZmN1dWt5eWtyaHVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxNzkxNjUsImV4cCI6MjA5Nzc1NTE2NX0.QSHbi71ajuU_AggJJ5xVDeb6jffDRyyuF4C7aYeHW3Y';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    const form = document.getElementById('absensiForm');
    const posSelect = document.getElementById('pos');
    const bisSelect = document.getElementById('bis');
    const daftarPesertaContainer = document.getElementById('daftarPesertaContainer');
    const checkboxList = document.getElementById('checkboxList');
    const selectAllCheckbox = document.getElementById('selectAll');
    const submitBtn = document.getElementById('submitBtn');
    const messageDiv = document.getElementById('message');

    // Fungsi untuk menghitung persentase
    function updateProgress() {
        const totalBoxes = document.querySelectorAll('.peserta-checkbox-item').length;
        const checkedBoxes = document.querySelectorAll('.peserta-checkbox-item:checked').length;
        
        if (totalBoxes === 0) return;
        
        const percentage = Math.round((checkedBoxes / totalBoxes) * 100);
        
        document.getElementById('progressText').innerHTML = `<i class="fas fa-users mr-1"></i> Hadir: ${checkedBoxes}/${totalBoxes} Peserta`;
        document.getElementById('progressPercent').innerText = `${percentage}%`;
        document.getElementById('progressBar').style.width = `${percentage}%`;
        
        // Ganti warna progress bar jika 100%
        const pb = document.getElementById('progressBar');
        if (percentage === 100) {
            pb.classList.remove('bg-primary-600');
            pb.classList.add('bg-secondary-500'); // Warna Gold kalau komplit
        } else {
            pb.classList.remove('bg-secondary-500');
            pb.classList.add('bg-primary-600');
        }
    }

    // Fungsi utama untuk memuat peserta beserta status absensinya
    async function loadPeserta() {
        const pos = posSelect.value;
        const bis = bisSelect.value;

        if (!bis) return;
        if (!pos) {
            daftarPesertaContainer.classList.remove('hidden');
            checkboxList.innerHTML = `
                <div class="flex flex-col items-center justify-center p-8 text-center text-secondary-600 bg-secondary-50 border border-secondary-200 rounded-xl">
                    <i class="fas fa-exclamation-triangle text-3xl mb-2"></i>
                    <p class="text-sm font-semibold">Mohon pilih Pos / Checkpoint terlebih dahulu di bagian atas.</p>
                </div>`;
            return;
        }

        daftarPesertaContainer.classList.remove('hidden');
        document.getElementById('progressWrapper').classList.add('hidden');
        checkboxList.innerHTML = `
            <div class="flex flex-col items-center justify-center p-8 text-center text-primary-600">
                <i class="fas fa-circle-notch fa-spin text-3xl mb-3"></i>
                <p class="text-sm font-medium">Sinkronisasi data peserta...</p>
            </div>`;
        selectAllCheckbox.checked = false;
        messageDiv.classList.add('hidden');

        try {
            // Ambil data peserta
            const { data: dataPeserta, error: errPeserta } = await supabaseClient
                .from('peserta')
                .select('*')
                .eq('nomer_bus', bis)
                .order('nama', { ascending: true });

            if (errPeserta) throw errPeserta;

            // Ambil data absen
            const { data: dataAbsen, error: errAbsen } = await supabaseClient
                .from('absensi_zarkasi')
                .select('nama')
                .eq('nomer_bus', bis)
                .eq('pos_pemberhentian', pos);

            if (errAbsen) throw errAbsen;

            const namaYangSudahAbsen = dataAbsen.map(row => row.nama);

            if (dataPeserta.length === 0) {
                checkboxList.innerHTML = `
                    <div class="p-6 text-center text-gray-500 bg-gray-50 rounded-xl border border-gray-200">
                        <i class="fas fa-box-open text-3xl mb-2 opacity-50"></i>
                        <p class="text-sm font-medium">Tidak ada data peserta untuk bus ini.</p>
                    </div>`;
                return;
            }

            checkboxList.innerHTML = '';
            
            dataPeserta.forEach((peserta) => {
                const isSudahAbsen = namaYangSudahAbsen.includes(peserta.nama);
                const dataString = JSON.stringify({ nama: peserta.nama, status: peserta.status });
                
                // Menentukan icon berdasar status
                const iconStatus = peserta.status.toLowerCase().includes('ustad') 
                    ? '<i class="fas fa-chalkboard-teacher mr-1.5 text-secondary-500"></i>' 
                    : '<i class="fas fa-user-graduate mr-1.5 text-primary-500"></i>';

                const label = document.createElement('label');
                
                // Tailwind class styling for items
                label.className = `checkbox-item flex items-center p-3 sm:p-4 rounded-xl border cursor-pointer ${
                    isSudahAbsen 
                    ? 'sudah-absen bg-gray-100 border-gray-200 opacity-70 cursor-not-allowed' 
                    : 'bg-slate-50 border-gray-200 hover:bg-primary-50'
                }`;
                
                label.innerHTML = `
                    <input type="checkbox" class="peserta-checkbox peserta-checkbox-item w-5 h-5 sm:w-6 sm:h-6 rounded border-gray-300 mr-4 flex-shrink-0" value='${dataString}' ${isSudahAbsen ? 'checked disabled' : ''}>
                    <div class="flex flex-col flex-1">
                        <div class="flex items-center justify-between flex-wrap gap-2">
                            <span class="font-bold text-gray-900 text-sm sm:text-base">${peserta.nama}</span>
                            ${isSudahAbsen ? '<span class="text-[10px] bg-primary-600 text-white px-2 py-0.5 rounded-full font-medium shadow-sm"><i class="fas fa-check mr-1"></i>Tersimpan</span>' : ''}
                        </div>
                        <span class="text-xs text-gray-500 font-medium mt-1 flex items-center">
                            ${iconStatus} ${peserta.status}
                        </span>
                    </div>
                `;
                checkboxList.appendChild(label);
            });

            document.getElementById('progressWrapper').classList.remove('hidden');
            updateProgress();

        } catch (error) {
            console.error(error);
            checkboxList.innerHTML = `
                <div class="p-6 text-center text-red-600 bg-red-50 rounded-xl border border-red-200">
                    <i class="fas fa-wifi text-3xl mb-2 opacity-70"></i>
                    <p class="text-sm font-semibold">Gagal terhubung ke database. Periksa koneksi internet Anda.</p>
                </div>`;
        }
    }

    bisSelect.addEventListener('change', loadPeserta);
    posSelect.addEventListener('change', () => {
        if (bisSelect.value) loadPeserta();
    });

    checkboxList.addEventListener('change', (e) => {
        if (e.target && e.target.classList.contains('peserta-checkbox-item')) {
            updateProgress();
            const allEnabled = document.querySelectorAll('.peserta-checkbox-item:not(:disabled)');
            const allEnabledChecked = document.querySelectorAll('.peserta-checkbox-item:not(:disabled):checked');
            selectAllCheckbox.checked = (allEnabled.length > 0 && allEnabled.length === allEnabledChecked.length);
        }
    });

    selectAllCheckbox.addEventListener('change', (e) => {
        const isChecked = e.target.checked;
        const checkboxes = document.querySelectorAll('.peserta-checkbox-item:not(:disabled)');
        checkboxes.forEach(cb => {
            cb.checked = isChecked;
        });
        updateProgress(); 
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const pos = posSelect.value;
        const bis = bisSelect.value;
        const checkedBoxes = document.querySelectorAll('.peserta-checkbox-item:checked:not(:disabled)');
        
        if (checkedBoxes.length === 0) {
            alert("Harap centang minimal 1 peserta baru yang hadir!");
            return;
        }

        submitBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Menyimpan Data...';
        submitBtn.disabled = true;
        messageDiv.classList.add('hidden');
        messageDiv.className = 'hidden mt-5 p-4 rounded-xl text-center text-sm font-semibold shadow-sm';

        const dataToInsert = Array.from(checkedBoxes).map(cb => {
            const peserta = JSON.parse(cb.value);
            return {
                nama: peserta.nama,
                status: peserta.status,
                nomer_bus: bis,
                pos_pemberhentian: pos
            };
        });

        const { error } = await supabaseClient
            .from('absensi_zarkasi')
            .insert(dataToInsert);

        submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Kirim Data Absensi';
        submitBtn.disabled = false;

        messageDiv.classList.remove('hidden');
        if (error) {
            console.error("Error:", error);
            messageDiv.classList.add('bg-red-50', 'text-red-700', 'border', 'border-red-200');
            messageDiv.innerHTML = `<i class="fas fa-times-circle mr-1"></i> Gagal menyimpan: ${error.message}`;
        } else {
            messageDiv.classList.add('bg-green-50', 'text-green-700', 'border', 'border-green-200');
            messageDiv.innerHTML = `<i class="fas fa-check-circle mr-1"></i> Berhasil menyimpan absen untuk <b>${checkedBoxes.length}</b> orang di ${pos}!`;
            loadPeserta();
        }
    });
</script>

</body>
</html>
